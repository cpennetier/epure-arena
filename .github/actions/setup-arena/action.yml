name: Set up Epure Arena
description: >-
  Install epure-arena and its declared extras exactly as a consumer would,
  from the committed pyproject metadata.

inputs:
  python-version:
    description: The Python interpreter to install against.
    required: false
    default: "3.12"
  extras:
    description: The optional-dependency extras to install.
    required: false
    default: "oracle,dev"

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
        cache-dependency-path: pyproject.toml

    # Epure Arena contains no Rust: no workspace manifest, no crates. The
    # toolchain is installed for exactly one reason — the declared
    # `ephemeris-kernel` dependency is a git reference that maturin builds
    # from source at install time. The compiled engine, and the Rust tests
    # that cover it, belong to Ephemeris Kernel and run in its repository.
    - name: Rust toolchain (to BUILD the ephemeris-kernel dependency)
      uses: dtolnay/rust-toolchain@stable

    - name: Install epure-arena[${{ inputs.extras }}]
      shell: bash
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e ".[${{ inputs.extras }}]"

    - name: Report the resolved environment
      shell: bash
      run: |
        python --version
        python -m pip --version
        python -m pip list
